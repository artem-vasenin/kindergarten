version: 1
disable_existing_loggers: false

formatters:
  colored:
    '()': colorlog.ColoredFormatter
    format: '%(log_color)s%(asctime)s [%(levelname)s] %(name)s - %(message)s'
    log_colors:
      DEBUG: cyan
      INFO: green
      WARNING: yellow
      ERROR: red
      CRITICAL: 'red,bg_white'

handlers:
  console:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: colored

root:
  level: INFO
  handlers: [console]

loggers:
  uvicorn:
    level: INFO
    handlers: [console]
    propagate: no

  uvicorn.error:
    level: INFO
    handlers: [console]
    propagate: no

  uvicorn.access:
    level: INFO
    handlers: [console]
    propagate: no